
name: Deploy Anti-Matrix to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anti-matrix-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/anti_matrix_key"
          chmod 600 "$HOME/.ssh/anti_matrix_key"

          ssh-keygen -y -f "$HOME/.ssh/anti_matrix_key" > /dev/null

          ssh-keyscan -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/anti_matrix_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'echo "VPS SSH authentication successful"'

      - name: Deploy application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          rsync -az \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.venv/' \
            --exclude='/app.py' \
            --exclude='/*.predeploy-*' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            -e "ssh -i $HOME/.ssh/anti_matrix_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/anti-matrix/"

          echo "Application files transferred."

      - name: Restart and verify Anti-Matrix
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/anti_matrix_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/local/bin/anti-matrix-deploy'

          echo "Anti-Matrix deployment succeeded."

      - name: Clean up SSH key
        if: always()
        run: |
          rm -f "$HOME/.ssh/anti_matrix_key"
