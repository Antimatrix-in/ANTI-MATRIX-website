
name: Deploy Anti-Matrix to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anti-matrix-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and validate SSH
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$VPS_PRIVATE_KEY" || -z "$VPS_HOST" ]]; then
            echo "Missing VPS SSH secrets."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/anti_matrix_key"
          chmod 600 "$HOME/.ssh/anti_matrix_key"

          ssh-keygen -y -f "$HOME/.ssh/anti_matrix_key" > /dev/null

          ssh-keyscan -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH key validated."

      - name: Test VPS SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$VPS_USER" ]]; then
            echo "Missing VPS_USER secret."
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/anti_matrix_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'printf "VPS SSH authentication successful\n"'

      - name: Deploy application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail

          # Do not use --delete.
          # Preserve server-specific configuration and safety files.
          rsync -az \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.venv/' \
            --exclude='/app.py' \
            --exclude='/*.predeploy-*' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            -e "ssh -i $HOME/.ssh/anti_matrix_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/anti-matrix/"

          echo "Application files transferred."

      - name: Restart and verify service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail

          # Execute the exact permitted sudo commands over SSH.
          ssh \
            -i "$HOME/.ssh/anti_matrix_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/bin/systemctl restart anti-matrix.service &&
             sudo -n /usr/bin/systemctl is-active --quiet anti-matrix.service &&
             for attempt in $(seq 1 15); do
               if curl --fail --silent http://127.0.0.1:8017/api/health > /dev/null; then
                 break
               fi
               if [ "$attempt" -eq 15 ]; then
                 echo "Health endpoint failed."
                 exit 1
               fi
               sleep 2
             done &&
             curl --fail --silent --show-error http://127.0.0.1:8017/api/health &&
             curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8017/'

          echo "Deployment and health checks succeeded."

      - name: Clean up SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/anti_matrix_key"
